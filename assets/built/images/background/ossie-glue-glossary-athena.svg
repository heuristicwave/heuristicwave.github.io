<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Business meaning made executable with AWS Glue and Apache Ossie</title>
  <desc id="desc">A four-stage flow from Glue business context through a Skill Asset and Apache Ossie semantic contract to compiled Athena results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="0.52" stop-color="#101a34"/><stop offset="1" stop-color="#0c2f45"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9900"/><stop offset="0.34" stop-color="#f97316"/><stop offset="0.67" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.08"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.5"/></filter>
    <style>
      .kicker{font:700 15px Arial,sans-serif;letter-spacing:3px;fill:#7dd3fc}.headline{font:800 43px Arial,sans-serif;letter-spacing:.4px;fill:#f8fafc}.sub{font:600 18px Arial,sans-serif;fill:#94a3b8}.step{font:800 13px Arial,sans-serif;letter-spacing:1.8px}.name{font:800 24px Arial,sans-serif;fill:#f8fafc}.lead{font:700 16px Arial,sans-serif;fill:#e2e8f0}.small{font:600 14px Arial,sans-serif;fill:#94a3b8}.chip{font:700 13px Arial,sans-serif;fill:#e2e8f0}.resultBig{font:800 20px Arial,sans-serif;fill:#fff}.resultSmall{font:600 13px Arial,sans-serif;fill:#bfdbfe}.footer{font:700 14px Arial,sans-serif;letter-spacing:1.4px;fill:#cbd5e1}.flow{fill:none;stroke:#7dd3fc;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/><rect width="1200" height="620" fill="url(#grid)"/>
  <circle cx="1060" cy="76" r="220" fill="#2563eb" opacity="0.10"/><circle cx="95" cy="560" r="250" fill="#0d9488" opacity="0.09"/>
  <rect x="56" y="50" width="1088" height="4" rx="2" fill="url(#glow)"/>
  <text class="kicker" x="60" y="92">AI-READY DATA · HANDS-ON POC</text>
  <text class="headline" x="60" y="143">BUSINESS MEANING, MADE EXECUTABLE</text>
  <text class="sub" x="60" y="177">AWS Glue Business Context · Skill Asset · Apache Ossie · Amazon Athena</text>
  <g filter="url(#shadow)">
    <rect x="58" y="226" width="244" height="280" rx="20" fill="#182033" stroke="#fb923c" stroke-width="2"/>
    <rect x="338" y="226" width="244" height="280" rx="20" fill="#182033" stroke="#a78bfa" stroke-width="2"/>
    <rect x="618" y="226" width="244" height="280" rx="20" fill="#182033" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="898" y="226" width="244" height="280" rx="20" fill="#182033" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <path class="flow" d="M310 366H328M321 359L328 366L321 373"/>
  <path class="flow" d="M590 366H608M601 359L608 366L601 373"/>
  <path class="flow" d="M870 366H888M881 359L888 366L881 373"/>
  <g transform="translate(58 226)">
    <text class="step" x="24" y="34" fill="#fb923c">01 · DISCOVER</text><text class="name" x="24" y="72">GLUE CONTEXT</text><text class="lead" x="24" y="106">업무 용어로 데이터를 찾습니다</text>
    <rect x="22" y="130" width="200" height="54" rx="12" fill="#2b2530" stroke="#7c4a25"/><text class="chip" x="122" y="152" text-anchor="middle">Glossary · Semantic Search</text><text class="small" x="122" y="173" text-anchor="middle">Net Revenue → orders</text>
    <text class="small" x="24" y="221">Meaning</text><text class="small" x="24" y="245">Discovery</text>
  </g>
  <g transform="translate(338 226)">
    <text class="step" x="24" y="34" fill="#a78bfa">02 · GUIDE</text><text class="name" x="24" y="72">SKILL ASSET</text><text class="lead" x="24" y="106">Agent를 계약으로 안내합니다</text>
    <rect x="22" y="130" width="200" height="54" rx="12" fill="#27233a" stroke="#6d5cae"/><text class="chip" x="122" y="152" text-anchor="middle">amazon::RelatedTo</text><text class="small" x="122" y="173" text-anchor="middle">URI → Skill Markdown</text>
    <text class="small" x="24" y="221">Context</text><text class="small" x="24" y="245">Instructions</text>
  </g>
  <g transform="translate(618 226)">
    <text class="step" x="24" y="34" fill="#2dd4bf">03 · DEFINE</text><text class="name" x="24" y="72">OSSIE CONTRACT</text><text class="lead" x="24" y="106">의미를 기계가 읽게 만듭니다</text>
    <rect x="22" y="130" width="200" height="54" rx="12" fill="#183337" stroke="#23776f"/><text class="chip" x="122" y="152" text-anchor="middle">Dataset · Metric</text><text class="small" x="122" y="173" text-anchor="middle">Relationship · AI Context</text>
    <text class="small" x="24" y="221">Portable YAML</text><text class="small" x="24" y="245">Validated Contract</text>
  </g>
  <g transform="translate(898 226)">
    <text class="step" x="24" y="34" fill="#60a5fa">04 · EXECUTE</text><text class="name" x="24" y="72">ATHENA QUERY</text><text class="lead" x="24" y="106">계약을 SQL로 검증합니다</text>
    <rect x="22" y="130" width="200" height="76" rx="12" fill="url(#result)"/><text class="resultBig" x="122" y="160" text-anchor="middle">SUCCEEDED</text><text class="resultSmall" x="122" y="185" text-anchor="middle">BUSAN 110K · SEOUL 320K</text>
    <text class="small" x="24" y="235">Custom Compiler</text><text class="small" x="24" y="259">Verified Result</text>
  </g>
  <rect x="60" y="545" width="1080" height="1" fill="#334155"/>
  <text class="footer" x="600" y="580" text-anchor="middle">BUSINESS CONTEXT  →  SEMANTIC CONTRACT  →  VERIFIED QUERY</text>
</svg>
